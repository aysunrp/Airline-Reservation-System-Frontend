<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AEROVA | Forgot Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/auth.css?v=ui1">
    <link rel="stylesheet" href="assets/css/i18n.css">
    <link rel="stylesheet" href="assets/css/chat-widget.css">

</head>

<body class="auth-body">

    <header class="auth-header">

        <div class="auth-logo">

            <svg class="auth-logo-mark" viewBox="0 0 64 32" aria-hidden="true">

                <path d="M2 15h20l6-8h4l-4 8h16l4-5h4l-3 5h11v3H49l3 5h-4l-4-5H28l4 8h-4l-6-8H2v-3z"/>

            </svg>

            <span class="auth-logo-text">Aerova</span>

        </div>

        <a class="auth-header-link" href="index.html" data-i18n="auth.backHome">Back to Home</a>

    </header>



    <main class="auth-main">

        <section class="auth-card" aria-label="Forgot password">

            <p class="auth-eyebrow" data-i18n="api.account.forgotEyebrow">Account help</p>

            <h1 class="auth-title" data-i18n="api.account.forgotTitle">Forgot your password?</h1>

            <p class="auth-subtitle" data-i18n="api.account.forgotSubtitle">Enter your email address and we will send you a link to choose a new password.</p>

            <p class="auth-notice" id="forgot-result" role="status" hidden></p>

            <form id="forgot-form" class="auth-form" novalidate>

                <div class="auth-field">

                    <label class="auth-label" for="forgot-email" data-i18n="auth.email">Email</label>

                    <div class="auth-control">

                        <input class="auth-input" id="forgot-email" name="email" type="email" autocomplete="email" data-i18n-placeholder="auth.emailPlaceholder" placeholder="you@email.com">

                        <p class="auth-error" hidden></p>

                    </div>

                </div>

                <button class="auth-submit" data-i18n="api.account.forgotButton" type="submit">Send reset link</button>

            </form>

            <p class="auth-footer-text"><a href="login.html" data-i18n="api.account.backToLogin">Back to sign in</a></p>

        </section>
    </main>



        <script src="assets/js/locales/en.js"></script>
    <script src="assets/js/locales/az.js"></script>
    <script src="assets/js/locales/ru.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/api-config.js?v=base1"></script>
    <script src="assets/js/api-client.js?v=mail1"></script>
    <script src="assets/js/chat-widget.js"></script>
    <script src="assets/js/auth.js?v=roles1"></script>

</body>

</html>
