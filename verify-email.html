<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AEROVA | Confirm Email</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/auth.css?v=mail1">
    <link rel="stylesheet" href="assets/css/i18n.css">
    <link rel="stylesheet" href="assets/css/chat-widget.css">

</head>

<body class="auth-body">

    <header class="auth-header">

        <div class="auth-logo">

            <svg class="auth-logo-mark" viewBox="0 0 64 32" aria-hidden="true">

                <path d="M2 15h20l6-8h4l-4 8h16l4-5h4l-3 5h11v3H49l3 5h-4l-4-5H28l4 8h-4l-6-8H2v-3z"/>

            </svg>

            <span class="auth-logo-text">Aerova</span>

        </div>

        <a class="auth-header-link" href="index.html" data-i18n="auth.backHome">Back to Home</a>

    </header>



    <main class="auth-main">

        <section class="auth-card" aria-label="Confirm email">

            <p class="auth-eyebrow" data-i18n="api.account.verifyEyebrow">Email address</p>

            <h1 class="auth-title" data-i18n="api.account.verifyTitle">Confirm your email</h1>

            <p class="auth-notice" id="verify-message" role="status" data-i18n="api.account.verifyLoading">Confirming your email address...</p>

            <p class="auth-links" id="verify-links">
                <a href="login.html" data-i18n="api.account.signIn">Sign in</a>
                <button type="button" class="auth-link-button" id="verify-resend" data-i18n="api.account.verifyResend" hidden>Send me a new link</button>
            </p>

        </section>
    </main>



        <script src="assets/js/locales/en.js"></script>
    <script src="assets/js/locales/az.js"></script>
    <script src="assets/js/locales/ru.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/api-config.js?v=base1"></script>
    <script src="assets/js/api-client.js?v=mail1"></script>
    <script src="assets/js/chat-widget.js"></script>
    <script src="assets/js/auth.js?v=mail2"></script>

</body>

</html>
