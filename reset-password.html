<!DOCTYPE html>

<html lang="az">

<head>

    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AEROVA | Şifrənin sıfırlanması</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/auth.css?v=code1">
    <link rel="stylesheet" href="assets/css/scrollbars.css">
    <link rel="stylesheet" href="assets/css/logo.css?v=thru8">
    <link rel="stylesheet" href="assets/css/chat-widget.css">

</head>

<body class="auth-body">

    <header class="auth-header">

        <div class="auth-logo">

            <span class="auth-logo-text">Aerova</span>

        </div>

        <a class="auth-header-link" href="index.html" data-i18n="auth.backHome">Ana səhifəyə qayıt</a>

    </header>



    <main class="auth-main">

        <section class="auth-card" aria-label="Şifrəni sıfırlayın">

            <p class="auth-eyebrow" data-i18n="api.account.resetEyebrow">Hesab köməyi</p>

            <h1 class="auth-title" data-i18n="api.account.resetTitle">Yeni şifrə seçin</h1>

            <p class="auth-subtitle" data-i18n="api.account.resetSubtitle">Hesabınız üçün yeni şifrə yazın.</p>

            <p class="auth-notice" id="reset-result" role="status" hidden></p>

            <form id="reset-form" class="auth-form" novalidate>

                <div class="auth-field">

                    <label class="auth-label" for="reset-password" data-i18n="api.account.newPassword">Yeni şifrə</label>

                    <div class="auth-control">

                        <input class="auth-input" id="reset-password" name="newPassword" type="password" autocomplete="new-password">

                        <p class="auth-error" hidden></p>

                    </div>

                </div>

                <div class="auth-field">

                    <label class="auth-label" for="reset-confirm" data-i18n="api.account.confirmNewPassword">Yeni şifrəni təsdiqləyin</label>

                    <div class="auth-control">

                        <input class="auth-input" id="reset-confirm" name="confirmPassword" type="password" autocomplete="new-password">

                        <p class="auth-error" hidden></p>

                    </div>

                </div>

                <button class="auth-submit" data-i18n="api.account.resetButton" type="submit">Şifrəni dəyiş</button>

            </form>

            <p class="auth-links" id="reset-links" hidden>
                <a href="forgot-password.html" data-i18n="api.account.newLink">Yeni kod al</a>
                <a href="login.html" data-i18n="api.account.backToLogin">Girişə qayıt</a>
            </p>

        </section>
    </main>



    <script src="assets/js/locales/az.js?v=az1"></script>
    <script src="assets/js/i18n.js?v=az1"></script>
    <script src="assets/js/api-config.js?v=az1"></script>
    <script src="assets/js/api-client.js?v=az1"></script>
    <script src="assets/js/chat-widget.js?v=az1"></script>
    <script src="assets/js/auth.js?v=az1"></script>

    <script src="assets/js/logo.js?v=az1"></script>

</body>

</html>
