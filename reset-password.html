<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AEROVA | Reset Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/auth.css?v=code1">
    <link rel="stylesheet" href="assets/css/i18n.css">
    <link rel="stylesheet" href="assets/css/logo.css?v=thru8">
    <link rel="stylesheet" href="assets/css/chat-widget.css">

</head>

<body class="auth-body">

    <header class="auth-header">

        <div class="auth-logo">

            <span class="auth-logo-text">Aerova</span>

        </div>

        <a class="auth-header-link" href="index.html" data-i18n="auth.backHome">Back to Home</a>

    </header>



    <main class="auth-main">

        <section class="auth-card" aria-label="Reset password">

            <p class="auth-eyebrow" data-i18n="api.account.resetEyebrow">Account help</p>

            <h1 class="auth-title" data-i18n="api.account.resetTitle">Choose a new password</h1>

            <p class="auth-subtitle" data-i18n="api.account.resetSubtitle">Enter a new password for your account.</p>

            <p class="auth-notice" id="reset-result" role="status" hidden></p>

            <form id="reset-form" class="auth-form" novalidate>

                <div class="auth-field">

                    <label class="auth-label" for="reset-password" data-i18n="api.account.newPassword">New password</label>

                    <div class="auth-control">

                        <input class="auth-input" id="reset-password" name="newPassword" type="password" autocomplete="new-password">

                        <p class="auth-error" hidden></p>

                    </div>

                </div>

                <div class="auth-field">

                    <label class="auth-label" for="reset-confirm" data-i18n="api.account.confirmNewPassword">Confirm new password</label>

                    <div class="auth-control">

                        <input class="auth-input" id="reset-confirm" name="confirmPassword" type="password" autocomplete="new-password">

                        <p class="auth-error" hidden></p>

                    </div>

                </div>

                <button class="auth-submit" data-i18n="api.account.resetButton" type="submit">Change password</button>

            </form>

            <p class="auth-links" id="reset-links" hidden>
                <a href="forgot-password.html" data-i18n="api.account.newLink">Get a new link</a>
                <a href="login.html" data-i18n="api.account.backToLogin">Back to sign in</a>
            </p>

        </section>
    </main>



        <script src="assets/js/locales/en.js?v=authcode2"></script>
    <script src="assets/js/locales/az.js?v=authcode2"></script>
    <script src="assets/js/locales/ru.js?v=authcode2"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/api-config.js?v=base1"></script>
    <script src="assets/js/api-client.js?v=stay1"></script>
    <script src="assets/js/chat-widget.js"></script>
    <script src="assets/js/auth.js?v=stay1"></script>

    <script src="assets/js/logo.js?v=thru1"></script>

</body>

</html>
