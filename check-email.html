<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AEROVA | Check Your Email</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/auth.css?v=code1">
    <link rel="stylesheet" href="assets/css/i18n.css">
    <link rel="stylesheet" href="assets/css/logo.css?v=thru8">
    <link rel="stylesheet" href="assets/css/chat-widget.css">

</head>

<body class="auth-body">

    <header class="auth-header">

        <div class="auth-logo">

            <span class="auth-logo-text">Aerova</span>

        </div>

        <a class="auth-header-link" href="index.html" data-i18n="auth.backHome">Back to Home</a>

    </header>



    <main class="auth-main">

        <section class="auth-card auth-card--status" aria-label="Check your email">

            <div class="auth-status" id="check-status" data-state="mail">

                <div class="auth-status-icon" aria-hidden="true">
                    <span class="auth-spinner auth-status-glyph auth-status-glyph--loading"></span>
                    <svg class="auth-status-glyph auth-status-glyph--mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7.5l8.5 6 8.5-6"/></svg>
                    <svg class="auth-status-glyph auth-status-glyph--success" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                    <svg class="auth-status-glyph auth-status-glyph--error" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
                </div>

                <p class="auth-eyebrow" data-i18n="api.account.checkEyebrow">Almost there</p>

                <h1 class="auth-title" id="check-title">Check your email</h1>

                <p class="auth-status-text" id="check-text"></p>

                <div class="auth-help-box">
                    <p class="auth-help-title" data-i18n="api.account.helpTitle">Did not get it?</p>
                    <ul class="auth-tips">
                        <li data-sent-only data-i18n="api.account.helpSpam">Look in your spam or promotions folder.</li>
                        <li data-sent-only data-i18n="api.account.helpWait">Wait a minute or two, delivery can be slow.</li>
                        <li data-i18n="api.account.helpResend">Sign in and press "Resend link" in your profile to get a new one.</li>
                    </ul>
                </div>

                <div class="auth-actions">
                    <a class="auth-submit" href="login.html" data-i18n="api.account.signIn">Sign in</a>
                </div>

            </div>

        </section>
    </main>



        <script src="assets/js/locales/en.js?v=authcode2"></script>
    <script src="assets/js/locales/az.js?v=authcode2"></script>
    <script src="assets/js/locales/ru.js?v=authcode2"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/api-config.js?v=base1"></script>
    <script src="assets/js/api-client.js?v=stay1"></script>
    <script src="assets/js/chat-widget.js"></script>
    <script src="assets/js/auth.js?v=stay1"></script>

    <script src="assets/js/logo.js?v=thru1"></script>

</body>

</html>
