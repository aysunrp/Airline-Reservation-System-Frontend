<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEROVA | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-body">
    <header class="auth-header">
        <a class="auth-logo" href="index.html" aria-label="AEROVA Home">
            <svg class="auth-logo-mark" viewBox="0 0 64 32" aria-hidden="true">
                <path d="M2 15h20l6-8h4l-4 8h16l4-5h4l-3 5h11v3H49l3 5h-4l-4-5H28l4 8h-4l-6-8H2v-3z"/>
            </svg>
            <span class="auth-logo-text">Aerova</span>
        </a>
        <a class="auth-header-link" href="index.html">Back to Home</a>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-label="Login">
            <p class="auth-eyebrow">Welcome Back</p>
            <h1 class="auth-title">Sign in to AEROVA</h1>
            <p class="auth-subtitle">Access your trips, profile, and travel preferences.</p>

            <form id="login-form" class="auth-form" novalidate>
                <div class="auth-field">
                    <label class="auth-label" for="login-email">Email</label>
                    <div class="auth-control">
                        <input class="auth-input" id="login-email" name="email" type="email" autocomplete="email" placeholder="you@email.com">
                        <p class="auth-error" hidden></p>
                    </div>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="login-password">Password</label>
                    <div class="auth-control">
                        <input class="auth-input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Your password">
                        <p class="auth-error" hidden></p>
                    </div>
                </div>

                <button class="auth-submit" type="submit">Login</button>
            </form>

            <p class="auth-footer-text">Don't have an account? <a href="register.html">Register</a></p>
        </section>
    </main>

    <script src="assets/js/auth.js"></script>
</body>
</html>
