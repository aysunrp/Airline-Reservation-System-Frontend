<!DOCTYPE html>

<html lang="az">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AEROVA | Giriş</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/auth.css?v=code1">
    <link rel="stylesheet" href="assets/css/scrollbars.css">
    <link rel="stylesheet" href="assets/css/logo.css?v=thru8">
    <link rel="stylesheet" href="assets/css/chat-widget.css">

</head>

<body class="auth-body">

    <header class="auth-header">

        <div class="auth-logo">

            <span class="auth-logo-text">Aerova</span>

        </div>

        <a class="auth-header-link" href="index.html" data-i18n="auth.backHome">Ana səhifəyə qayıt</a>

    </header>



    <main class="auth-main">

        <section class="auth-card" aria-label="Giriş" data-i18n-aria="nav.login">

            <p class="auth-eyebrow" data-i18n="auth.loginEyebrow">Xoş gəldiniz</p>

            <h1 class="auth-title" data-i18n="auth.loginTitle">AEROVA-ya daxil olun</h1>

            <p class="auth-subtitle" data-i18n="auth.loginSubtitle">Səyahətlərinizə, profilinizə və üstünlüklərinizə çatın.</p>

            <p class="auth-notice" id="login-notice" role="status" hidden></p>



            <form id="login-form" class="auth-form" novalidate>

                <div class="auth-field">

                    <label class="auth-label" for="login-email" data-i18n="auth.email">E-poçt</label>

                    <div class="auth-control">

                        <input class="auth-input" id="login-email" name="email" type="email" autocomplete="email"  data-i18n-placeholder="auth.emailPlaceholder" placeholder="siz@email.com">

                        <p class="auth-error" hidden></p>

                    </div>

                </div>



                <div class="auth-field">

                    <label class="auth-label" for="login-password" data-i18n="auth.password">Şifrə</label>

                    <div class="auth-control">

                        <input class="auth-input" id="login-password" name="password" type="password" autocomplete="current-password"  data-i18n-placeholder="auth.passwordPlaceholder" placeholder="Şifrəniz">

                        <p class="auth-error" hidden></p>

                    </div>

                </div>



                <p class="auth-forgot"><a href="forgot-password.html" data-i18n="api.account.forgotLink">Şifrəni unutmusunuz?</a></p>

                <button class="auth-submit" data-i18n="auth.loginButton" type="submit">Giriş</button>

            </form>



            <p class="auth-footer-text"><span data-i18n="auth.noAccount">Hesabınız yoxdur?</span> <a href="register.html" data-i18n="auth.registerLink">Qeydiyyat</a></p>

        </section>

    </main>



    <script src="assets/js/locales/az.js?v=az1"></script>
    <script src="assets/js/i18n.js?v=az1"></script>
    <script src="assets/js/api-config.js?v=az1"></script>
    <script src="assets/js/api-client.js?v=az1"></script>
    <script src="assets/js/chat-widget.js?v=az1"></script>
    <script src="assets/js/auth.js?v=az1"></script>

    <script src="assets/js/logo.js?v=az1"></script>

</body>

</html>
