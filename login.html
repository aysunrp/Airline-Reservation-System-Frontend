<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AEROVA | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/i18n.css">

</head>

<body class="auth-body">

    <header class="auth-header">

        <a class="auth-logo" href="index.html" aria-label="AEROVA Home" data-i18n-aria="nav.homeAria">

            <svg class="auth-logo-mark" viewBox="0 0 64 32" aria-hidden="true">

                <path d="M2 15h20l6-8h4l-4 8h16l4-5h4l-3 5h11v3H49l3 5h-4l-4-5H28l4 8h-4l-6-8H2v-3z"/>

            </svg>

            <span class="auth-logo-text">Aerova</span>

        </a>

        <a class="auth-header-link" href="index.html" data-i18n="auth.backHome">Back to Home</a>

    </header>



    <main class="auth-main">

        <section class="auth-card" aria-label="Login" data-i18n-aria="nav.login">

            <p class="auth-eyebrow" data-i18n="auth.loginEyebrow">Welcome Back</p>

            <h1 class="auth-title" data-i18n="auth.loginTitle">Sign in to AEROVA</h1>

            <p class="auth-subtitle" data-i18n="auth.loginSubtitle">Access your trips, profile, and travel preferences.</p>



            <form id="login-form" class="auth-form" novalidate>

                <div class="auth-field">

                    <label class="auth-label" for="login-email" data-i18n="auth.email">Email</label>

                    <div class="auth-control">

                        <input class="auth-input" id="login-email" name="email" type="email" autocomplete="email"  data-i18n-placeholder="auth.emailPlaceholder" placeholder="you@email.com">

                        <p class="auth-error" hidden></p>

                    </div>

                </div>



                <div class="auth-field">

                    <label class="auth-label" for="login-password" data-i18n="auth.password">Password</label>

                    <div class="auth-control">

                        <input class="auth-input" id="login-password" name="password" type="password" autocomplete="current-password"  data-i18n-placeholder="auth.passwordPlaceholder" placeholder="Your password">

                        <p class="auth-error" hidden></p>

                    </div>

                </div>



                <button class="auth-submit" data-i18n="auth.loginButton" type="submit">Login</button>

            </form>



            <p class="auth-footer-text"><span data-i18n="auth.noAccount">Don't have an account?</span> <a href="register.html" data-i18n="auth.registerLink">Register</a></p>

        </section>

    </main>



        <script src="assets/js/locales/en.js"></script>
    <script src="assets/js/locales/az.js"></script>
    <script src="assets/js/locales/ru.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/auth.js"></script>

</body>

</html>
