<!DOCTYPE html>

<html lang="az">

<head>

    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AEROVA | Kodu daxil edin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/auth.css?v=code1">
    <link rel="stylesheet" href="assets/css/scrollbars.css">
    <link rel="stylesheet" href="assets/css/logo.css?v=thru8">
    <link rel="stylesheet" href="assets/css/chat-widget.css">

</head>

<body class="auth-body">

    <header class="auth-header">
        <div class="auth-logo">
            <span class="auth-logo-text">Aerova</span>
        </div>
        <a class="auth-header-link" href="index.html" data-i18n="auth.backHome">Ana səhifəyə qayıt</a>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-label="Sıfırlama kodunu daxil edin">
            <p class="auth-eyebrow" data-i18n="api.account.codeEyebrow">Hesab köməyi</p>
            <h1 class="auth-title" data-i18n="api.account.codeTitle">Kodu daxil edin</h1>
            <p class="auth-subtitle" id="code-subtitle" aria-live="polite"></p>

            <p class="auth-notice" id="code-result" role="status" hidden></p>

            <form id="code-form" class="auth-form" novalidate>
                <div class="auth-field">
                    <span class="auth-label" id="code-label" data-i18n="api.account.codeLabel">6 rəqəmli kod</span>
                    <div class="code-boxes" role="group" aria-labelledby="code-label">
                        <input class="code-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code">
                        <input class="code-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
                        <input class="code-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
                        <input class="code-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
                        <input class="code-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
                        <input class="code-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off">
                    </div>
                    <p class="auth-error code-error" id="code-error" role="alert" hidden></p>
                </div>

                <button class="auth-submit" data-i18n="api.account.codeButton" type="submit">Kodu təsdiqlə</button>
            </form>

            <p class="auth-links auth-links--between">
                <button type="button" class="auth-link-button" id="code-resend" disabled data-i18n="api.account.codeResend">Yeni kod göndər</button>
                <a href="forgot-password.html" data-i18n="api.account.codeStartAgain">Yenidən başla</a>
            </p>
            <p class="auth-footer-text"><a href="login.html" data-i18n="api.account.backToLogin">Girişə qayıt</a></p>
        </section>
    </main>

    <script src="assets/js/locales/az.js?v=az1"></script>
    <script src="assets/js/i18n.js?v=az1"></script>
    <script src="assets/js/api-config.js?v=az1"></script>
    <script src="assets/js/api-client.js?v=az1"></script>
    <script src="assets/js/chat-widget.js?v=az1"></script>
    <script src="assets/js/auth.js?v=az1"></script>
    <script src="assets/js/logo.js?v=az1"></script>
</body>

</html>
