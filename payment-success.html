<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AEROVA | Payment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/auth.css?v=ui1">
    <link rel="stylesheet" href="assets/css/i18n.css">
    <link rel="stylesheet" href="assets/css/scrollbars.css">
    <link rel="stylesheet" href="assets/css/logo.css?v=thru8">
    <link rel="stylesheet" href="assets/css/chat-widget.css">
    <link rel="stylesheet" href="assets/css/payment-return.css?v=stripe1">

</head>

<body class="auth-body" data-return="success">

    <header class="auth-header">

        <div class="auth-logo">

            <span class="auth-logo-text">Aerova</span>

        </div>

        <a class="auth-header-link" href="index.html" data-i18n="auth.backHome">Back to Home</a>

    </header>



    <main class="auth-main">

        <section class="auth-card auth-card--status" aria-label="Payment">

            <div class="auth-status" id="return-status" data-state="loading" aria-live="polite" aria-busy="true">

                <div class="auth-status-icon" aria-hidden="true">
                    <span class="auth-spinner auth-status-glyph auth-status-glyph--loading"></span>
                    <svg class="auth-status-glyph auth-status-glyph--success" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                    <svg class="auth-status-glyph auth-status-glyph--error" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
                    <svg class="auth-status-glyph auth-status-glyph--cancel" viewBox="0 0 24 24"><path d="M9 7 4.5 11.5 9 16"/><path d="M5 11.5h9.5a4.5 4.5 0 0 1 0 9H12"/></svg>
                </div>

                <p class="auth-eyebrow" data-i18n="api.payment.returnEyebrow">Payment</p>

                <h1 class="auth-title" id="return-title"></h1>

                <p class="auth-status-text" id="return-text"></p>

                <dl class="payment-return-summary" id="return-summary" hidden></dl>

                <div class="auth-actions" id="return-actions">
                    <a class="auth-submit" id="return-primary" href="confirmation.html" data-i18n="api.payment.viewBooking" hidden>View my booking</a>
                    <a class="auth-link-button" id="return-trips" href="my-trips.html" data-i18n="api.payment.myTrips" hidden>My trips</a>
                    <button type="button" class="auth-submit" id="return-again" data-i18n="api.payment.checkAgain" hidden>Check again</button>
                    <a class="auth-submit" id="return-retry" href="payment.html" data-i18n="api.payment.tryAgain" hidden>Try the payment again</a>
                    <a class="auth-link-button" id="return-home" href="index.html" data-i18n="auth.backHome" hidden>Back to Home</a>
                </div>

            </div>

        </section>
    </main>



        <script src="assets/js/locales/en.js?v=stripe1"></script>
    <script src="assets/js/locales/az.js?v=stripe1"></script>
    <script src="assets/js/locales/ru.js?v=stripe1"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/api-config.js?v=base1"></script>
    <script src="assets/js/api-client.js?v=stay1"></script>
    <script src="assets/js/airports.js"></script>
    <script src="assets/js/booking-api.js?v=stripe1"></script>
    <script src="assets/js/chat-widget.js"></script>
    <script src="assets/js/auth.js?v=stay1"></script>

    <script src="assets/js/logo.js?v=thru1"></script>

    <script src="assets/js/payment-return.js?v=stripe1"></script>

</body>

</html>
