<!DOCTYPE html>

<html lang="az">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="assets/js/theme.js?v=th1"></script>

    <title>AEROVA | Qeydiyyat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/auth.css?v=code1">
    <link rel="stylesheet" href="assets/css/scrollbars.css">
    <link rel="stylesheet" href="assets/css/logo.css?v=thru8">
    <link rel="stylesheet" href="assets/css/chat-widget.css">

    <link rel="stylesheet" href="assets/css/theme.css?v=th2">
    <link rel="stylesheet" href="assets/css/design.css?v=ds1">
</head>

<body class="auth-body">

    <header class="auth-header">

        <div class="auth-logo">

            <span class="auth-logo-text">Aerova</span>

        </div>

        <a class="auth-header-link" href="index.html" data-i18n="auth.backHome">Ana səhifəyə qayıt</a>

    </header>



    <main class="auth-main">

        <section class="auth-card" aria-label="Qeydiyyat" data-i18n-aria="auth.registerLink">

            <p class="auth-eyebrow" data-i18n="auth.registerEyebrow">AEROVA-ya qoşulun</p>

            <h1 class="auth-title" data-i18n="auth.registerTitle">Hesab yaradın</h1>

            <p class="auth-subtitle" data-i18n="auth.registerSubtitle">Bronları və fərdiləşdirilmiş səyahət məlumatlarını idarə etmək üçün qeydiyyatdan keçin.</p>



            <form id="register-form" class="auth-form" novalidate>

                <div class="auth-row">

                <div class="auth-field">

                    <label class="auth-label" for="register-first-name" data-i18n="auth.firstName">Ad</label>

                    <div class="auth-control">

                        <input class="auth-input" id="register-first-name" name="firstName" type="text" autocomplete="given-name" data-i18n-placeholder="auth.firstNamePh" placeholder="Ad">

                        <p class="auth-error" hidden></p>

                    </div>

                </div>



                <div class="auth-field">

                    <label class="auth-label" for="register-last-name" data-i18n="auth.lastName">Soyad</label>

                    <div class="auth-control">

                        <input class="auth-input" id="register-last-name" name="lastName" type="text" autocomplete="family-name" data-i18n-placeholder="auth.lastNamePh" placeholder="Soyad">

                        <p class="auth-error" hidden></p>

                    </div>

                </div>

                </div>



                <div class="auth-field">

                    <label class="auth-label" for="register-email" data-i18n="auth.email">E-poçt</label>

                    <div class="auth-control">

                        <input class="auth-input" id="register-email" name="email" type="email" autocomplete="email" data-i18n-placeholder="auth.emailPlaceholder" placeholder="siz@email.com">

                        <p class="auth-error" hidden></p>

                    </div>

                </div>



                <div class="auth-field">

                    <label class="auth-label" for="register-password" data-i18n="auth.password">Şifrə</label>

                    <div class="auth-control">

                        <input class="auth-input" id="register-password" name="password" type="password" autocomplete="new-password" data-i18n-placeholder="auth.passwordPhLong" placeholder="Ən azı 6 simvol">

                        <p class="auth-error" hidden></p>

                    </div>

                </div>



                <div class="auth-field">

                    <label class="auth-label" for="register-confirm-password" data-i18n="auth.confirmPassword">Şifrəni təsdiqləyin</label>

                    <div class="auth-control">

                        <input class="auth-input" id="register-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" data-i18n-placeholder="auth.confirmPh" placeholder="Şifrəni təkrarlayın">

                        <p class="auth-error" hidden></p>

                    </div>

                </div>



                <ul class="auth-rules" id="register-rules" aria-live="polite">

                    <li data-rule="length" data-i18n="auth.reqLength">Ən azı 6 simvol</li>

                    <li data-rule="match" data-i18n="auth.reqMatch">Şifrələr üst-üstə düşür</li>

                </ul>



                <button class="auth-submit" data-i18n="auth.createAccount" type="submit">Hesab yarat</button>

            </form>



            <p class="auth-footer-text"><span data-i18n="auth.hasAccount">Artıq hesabınız var?</span> <a href="login.html" data-i18n="auth.loginLink">Giriş</a></p>

        </section>

    </main>



    <script src="assets/js/locales/az.js?v=th1"></script>
    <script src="assets/js/i18n.js?v=az1"></script>
    <script src="assets/js/api-config.js?v=az1"></script>
    <script src="assets/js/api-client.js?v=az1"></script>
    <script src="assets/js/chat-widget.js?v=az1"></script>
    <script src="assets/js/auth.js?v=th1"></script>

    <script src="assets/js/logo.js?v=az1"></script>

</body>

</html>
