<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEROVA | Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-body">
    <header class="auth-header">
        <a class="auth-logo" href="index.html" aria-label="AEROVA Home">
            <svg class="auth-logo-mark" viewBox="0 0 64 32" aria-hidden="true">
                <path d="M2 15h20l6-8h4l-4 8h16l4-5h4l-3 5h11v3H49l3 5h-4l-4-5H28l4 8h-4l-6-8H2v-3z"/>
            </svg>
            <span class="auth-logo-text">Aerova</span>
        </a>
        <a class="auth-header-link" href="login.html">Sign in</a>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-label="Register">
            <p class="auth-eyebrow">Join AEROVA</p>
            <h1 class="auth-title">Create your account</h1>
            <p class="auth-subtitle">Register to manage bookings and personalized travel details.</p>

            <form id="register-form" class="auth-form" novalidate>
                <div class="auth-field">
                    <label class="auth-label" for="register-first-name">First Name</label>
                    <div class="auth-control">
                        <input class="auth-input" id="register-first-name" name="firstName" type="text" autocomplete="given-name" placeholder="First name">
                        <p class="auth-error" hidden></p>
                    </div>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="register-last-name">Last Name</label>
                    <div class="auth-control">
                        <input class="auth-input" id="register-last-name" name="lastName" type="text" autocomplete="family-name" placeholder="Last name">
                        <p class="auth-error" hidden></p>
                    </div>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="register-email">Email</label>
                    <div class="auth-control">
                        <input class="auth-input" id="register-email" name="email" type="email" autocomplete="email" placeholder="you@email.com">
                        <p class="auth-error" hidden></p>
                    </div>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="register-password">Password</label>
                    <div class="auth-control">
                        <input class="auth-input" id="register-password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters">
                        <p class="auth-error" hidden></p>
                    </div>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="register-confirm-password">Confirm Password</label>
                    <div class="auth-control">
                        <input class="auth-input" id="register-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat password">
                        <p class="auth-error" hidden></p>
                    </div>
                </div>

                <button class="auth-submit" type="submit">Create Account</button>
            </form>

            <p class="auth-footer-text">Already have an account? <a href="login.html">Login</a></p>
        </section>
    </main>

    <script src="assets/js/auth.js"></script>
</body>
</html>
